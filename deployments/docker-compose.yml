name: driftlens
services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DRIFTLENS_API_TOKEN: ${DRIFTLENS_API_TOKEN:?Run python scripts/init-env.py first}
    volumes:
      - driftlens-data:/data
      - ../demo:/repositories:ro
      - ../credentials:/credentials:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/api/health]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  driftlens-data:
