name: Verify DriftLens
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - run: go test -race ./...
        working-directory: backend
      - run: go vet ./... && go build ./cmd/server
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build && npm audit --omit=dev
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/init-env.py
          docker compose --env-file .env -f deployments/docker-compose.yml up --build -d --wait
          curl --fail http://127.0.0.1:8080/api/health
          curl --fail http://127.0.0.1:8080/ > /dev/null
      - if: failure()
        run: docker compose --env-file .env -f deployments/docker-compose.yml logs --tail 80
      - if: always()
        run: docker compose --env-file .env -f deployments/docker-compose.yml down
  kind-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.19.0
      - uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.30.0
      - run: python3 scripts/demo.py up
      - run: |
          cd backend
          go build -o ../.data/driftlens ./cmd/server
          DRIFTLENS_DATA_DIR=../.data DRIFTLENS_REPOSITORY_ROOT=../demo DRIFTLENS_CREDENTIAL_ROOT=../credentials ../.data/driftlens > ../.data/server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/api/health && break; sleep 2; done
      - run: |
          python3 scripts/demo.py connect
          python3 scripts/demo.py verify --expect sync
          python3 scripts/demo.py drift
          python3 scripts/demo.py verify --expect drift
      - if: always()
        run: python3 scripts/demo.py down
