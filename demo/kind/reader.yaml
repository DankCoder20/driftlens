apiVersion: v1
kind: ServiceAccount
metadata:
  name: driftlens-reader
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: driftlens-reader
rules:
  - apiGroups: ['*']
    resources: ['*']
    verbs: ['get', 'list', 'watch']
  - nonResourceURLs: ['/version', '/api', '/api/*', '/apis', '/apis/*']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: driftlens-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: driftlens-reader
subjects:
  - kind: ServiceAccount
    name: driftlens-reader
    namespace: kube-system
